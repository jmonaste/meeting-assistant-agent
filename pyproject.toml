[project]
name = "meeting-assistant"
version = "0.1.0"
description = "LangGraph agent that reviews a meeting transcript in multiple passes and extracts everything worth keeping: summary, decisions, action items, questions, risks, dates, entities and more, as Markdown and JSON."
readme = "README.md"
authors = [
    { name = "javier monasterio", email = "javiermonasterio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.6",
    "langgraph-checkpoint-sqlite>=3.0.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
meeting-assistant = "meeting_assistant.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_assistant = ["py.typed"]
